<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
<title id="title">SiNAVM Internet Network Logo</title><desc id="desc">SiNAVM chrome wordmark with emerald Wi-Fi signal and network orbit</desc>
<defs>
 <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".42" stop-color="#cbd3d0"/><stop offset=".7" stop-color="#68716e"/><stop offset="1" stop-color="#f4f7f5"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d2ff83"/><stop offset=".45" stop-color="#42df83"/><stop offset="1" stop-color="#008c50"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g fill="none" stroke="url(#green)" stroke-linecap="round" filter="url(#glow)">
 <path d="M112 240a248 175 0 0 1 496 0" stroke-width="5" opacity=".8"/>
 <path d="M140 285a220 155 0 0 0 440 0" stroke-width="3" opacity=".55"/>
 <path d="M265 98a135 135 0 0 1 190 0" stroke-width="20"/>
 <path d="M300 135a85 85 0 0 1 120 0" stroke-width="18"/>
 <path d="M338 171a31 31 0 0 1 44 0" stroke-width="16"/>
</g>
<g fill="url(#green)" filter="url(#glow)"><circle cx="360" cy="203" r="10"/><circle cx="112" cy="240" r="7"/><circle cx="608" cy="240" r="7"/><circle cx="360" cy="415" r="6"/></g>
<text x="360" y="330" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="900" letter-spacing="-5" fill="url(#silver)" stroke="#17221b" stroke-width="8" paint-order="stroke" filter="url(#shadow)">SiNAVM</text>
<path d="M105 350c115 72 393 75 510-5" fill="none" stroke="url(#green)" stroke-width="3" opacity=".65"/>
</svg>