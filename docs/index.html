.radar-panels{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* MINIMAL SPEEDTEST UI */
body{background:#101512;color:#edf2e8}.shell{display:block;max-width:1080px;min-height:100vh}.compact-main{padding:0 28px 36px}.compact-top{height:76px;border-color:#2a352c}.compact-top .brand{display:flex;align-items:center;gap:11px}.compact-top .brandmark{width:40px;height:40px;background:var(--lime);border-radius:50%;display:grid;place-items:center}.compact-top .brandname{color:#edf2e8}.compact-top .brandname small{color:#a6b0a2}.compact-top .refresh{background:#202a23;border-color:#39463b;color:#dfe8d8}
.sectionhead h2{color:#f0f3ea;font-size:clamp(20px,3vw,28px)}.sectionhead p,.sectionnum,.caption,.disclaimer{display:none!important}#speedtest{padding-top:34px}#speedtest .split{grid-template-columns:1fr .85fr;gap:16px;align-items:stretch}#speedtest .surface{background:#1a211c;border-color:#303c32;color:#edf2e8;padding:22px}#speedtest .surface.dark{background:#1a211c}#speedtest .surfacehead{display:none}#speedtest .surfacehead h3{font-size:13px}#speedtest .speedvalues{gap:14px;margin-top:24px}#speedtest .speedvalue{border-color:#303c32}#speedtest .speedvalue small,#speedtest .speedvalue em{color:#8f9b8c}#speedtest .speedvalue b{color:#f3f6ed;font-size:24px}
.start-wrap{display:grid;place-items:center;padding:8px 0 18px}.start-ring{width:190px;height:190px;max-width:70vw;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:8px solid #354235;background:conic-gradient(var(--lime) 0deg,#202a23 0deg);color:#eaf4df;box-shadow:0 0 0 1px #53634b,0 0 55px #c7f36b12;transition:background .18s,transform .2s}.start-ring{position:relative;isolation:isolate}.start-ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#1a211c;z-index:-1}.start-ring span{font:700 32px "DM Mono",Vazirmatn,sans-serif;direction:ltr}.start-ring small{font-size:12px;font-weight:700}.start-ring:hover{transform:scale(1.025);box-shadow:0 0 0 1px #78945a,0 0 60px #c7f36b22}.start-ring:disabled{opacity:1;cursor:progress}#testState,#phaseTitle,#phaseDesc{display:none!important}.gaugewrap{min-height:195px}.gauge{width:164px;height:164px}.gauge:before{background:#1a211c}.progressline{height:5px;background:#303c32}.progresscaption{color:#8f9b8c;font-size:10px}
#my-radar{padding-top:32px}#my-radar .sectionhead{margin-bottom:15px}#my-radar .surface{background:#1a211c;border-color:#303c32;color:#edf2e8}#my-radar .radar-items{max-height:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}#my-radar .radar-item{background:#202a23;border-color:#344136;padding:12px}#my-radar .radar-item b{font-size:11px;color:#f0f3ea}#my-radar .radar-item small{font-size:9px;color:#a3afa0}#my-radar .radar-foot,#my-radar .radar-progress,#my-radar .surfacehead,#my-radar .radar-summary,#my-radar #myScanState{display:none!important}.foot,.seo-section,.bottom-intro,.network-map-section{display:none!important}
@media(max-width:760px){.compact-main{padding:0 14px 28px}#speedtest .split{grid-template-columns:1fr}.start-ring{width:170px;height:170px}#my-radar .radar-items{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){.start-ring{transition:none}}

<body>
<div class="shell">
<main class="main compact-main">
 <header class="top compact-top"><a class="brand" href="https://sinavm.github.io/sinavm/"><span class="brandmark">⌁</span><span class="brandname">IR NET ATLAS<small>INTERNET TEST</small></span></a><button class="refresh" id="refresh" aria-label="تازه‌سازی">↻</button></header>
 <section class="section" id="speedtest"><div class="sectionhead"><div><h2>تست اینترنت</h2></div></div>
  <div class="split">
   <article class="surface"><div class="start-wrap"><button class="testbutton start-ring" id="run" type="button" aria-label="شروع تست اینترنت"><span id="startNum">شروع</span><small id="startLabel">تست اینترنت</small></button></div>
    <div class="speedvalues"><div class="speedvalue"><small>LATENCY</small><b id="latency">—</b><em>ms · مقصد انتخابی</em></div><div class="speedvalue"><small>DOWNLOAD</small><b id="download">—</b><em>Mbps</em></div><div class="speedvalue"><small>UPLOAD</small><b id="upload">—</b><em>Mbps</em></div></div>
    
   </article>
   <article class="surface dark"><div class="gaugewrap"><div class="gauge" id="gauge"><div class="gaugeinner"><b id="gaugeNum">—</b><small id="gaugeUnit">Mbps</small></div></div></div><div class="progressline" id="testProgress" role="progressbar" aria-label="پیشرفت تست" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress"></i></div><div class="progresscaption"><span id="phase">آماده</span><span id="pct">۰٪</span></div></article>
  </div>
 </section>
 
 <section class="section" id="my-radar"><div class="sectionhead"><div><h2>با اینترنت شما این سایت‌ها باز می‌شوند</h2></div></div>
  <div class="radar-panels">
   <article class="surface">
    <div class="caption" id="myScanState"></div>
    <div class="radar-items" id="myRadarList" style="margin-top:12px"></div>
    
   </article>
   
  </div>
 </section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let statusData=null,testing=false;const fa=n=>new Intl.NumberFormat('fa-IR').format(n);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function progress(p,label){p=Math.max(0,Math.min(100,Math.round(Number(p)||0)));const deg=p*3.6;$('startNum').textContent=fa(p)+'٪';$('startLabel').textContent=label;$('run').style.background='conic-gradient(var(--lime) '+deg+'deg,#202a23 '+deg+'deg)';$('progress').style.width=p+'%';$('testProgress').setAttribute('aria-valuenow',String(p));$('pct').textContent=fa(p)+'٪';$('phase').textContent=label}
function gauge(v,unit='Mbps'){$('gaugeNum').textContent=v==null?'—':Number(v).toFixed(1);$('gaugeUnit').textContent=unit;const deg=v==null?0:Math.max(0,Math.min(360,v/200*360));$('gauge').style.background='conic-gradient(var(--lime) '+deg+'deg,#303c32 '+deg+'deg 360deg)'}
async function req(url,opt={},ms=16000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...opt,signal:c.signal})}finally{clearTimeout(t)}}
async function latency(url){const samples=[];for(let i=0;i<4;i++){const st=performance.now();try{await req(url.replace(/\/$/,'')+'/favicon.ico?atlas='+Date.now()+i,{mode:'no-cors',cache:'no-store',credentials:'omit'},6000);samples.push(performance.now()-st)}catch(e){}}if(!samples.length)return null;samples.sort((a,b)=>a-b);return Math.round(samples[Math.floor(samples.length/2)])}
async function download(){let best=0;for(const n of [1000000,5000000,10000000]){const st=performance.now(),r=await req('https://speed.cloudflare.com/__down?bytes='+n+'&atlas='+Date.now(),{mode:'cors',cache:'no-store',credentials:'omit'},18000);if(!r.ok)throw Error();const b=await r.arrayBuffer(),sec=(performance.now()-st)/1000;best=Math.max(best,b.byteLength*8/1e6/sec);if(sec>7)break}return best}
async function upload(){let best=0;for(const n of [1000000,3000000,5000000]){const body=new Uint8Array(n),st=performance.now(),r=await req('https://speed.cloudflare.com/__up?atlas='+Date.now(),{method:'POST',body,mode:'cors',cache:'no-store',credentials:'omit'},18000);if(!r.ok)throw Error();await r.arrayBuffer();const sec=(performance.now()-st)/1000;best=Math.max(best,n*8/1e6/sec);if(sec>7)break}return best}
async function load(){try{const r=await fetch('./status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();statusData=await r.json()}catch(e){statusData=null}}
async function probe(t){const st=performance.now(),c=new AbortController(),timer=setTimeout(()=>c.abort(),6500);try{await fetch(t.url,{method:'GET',mode:'no-cors',cache:'no-store',credentials:'omit',redirect:'follow',signal:c.signal});return{id:t.id,name:t.name,state:'up',ms:Math.round(performance.now()-st)}}catch(e){return{id:t.id,name:t.name,state:'down',ms:null}}finally{clearTimeout(timer)}}
function paintResults(rows){$('myRadarList').innerHTML=rows.map(x=>'<div class="radar-item"><i class="radar-dot '+x.state+'"></i><div><b>'+esc(x.name)+'</b><small>'+(x.state==='up'?'باز می‌شود':'باز نشد')+'</small></div></div>').join('')}
async function scan(){if(!statusData?.targets?.length)await load();if(!statusData?.targets?.length)throw Error();const extra=[{id:'gemini',name:'Gemini',url:'https://gemini.google.com'},{id:'claude',name:'Claude',url:'https://claude.ai'},{id:'copilot',name:'Copilot',url:'https://copilot.microsoft.com'},{id:'deepseek',name:'DeepSeek',url:'https://chat.deepseek.com'},{id:'perplexity',name:'Perplexity',url:'https://www.perplexity.ai'},{id:'grok',name:'Grok',url:'https://grok.com'},{id:'metaai',name:'Meta AI',url:'https://www.meta.ai'}];const targets=[...statusData.targets,...extra.filter(a=>!statusData.targets.some(t=>t.id===a.id))];const results=[];let i=0;await Promise.all(Array.from({length:5},async()=>{while(i<targets.length){const t=targets[i++];results.push(await probe(t));paintResults(results);progress(78+Math.round(results.length/targets.length*22),'بررسی سایت‌ها')}}));results.sort((a,b)=>targets.findIndex(t=>t.id===a.id)-targets.findIndex(t=>t.id===b.id));paintResults(results)}
$('run').addEventListener('click',async()=>{if(testing)return;testing=true;const b=$('run');b.disabled=true;b.setAttribute('aria-busy','true');['latency','download','upload'].forEach(id=>$(id).textContent='—');gauge(null);try{progress(2,'شروع');progress(7,'پینگ');try{const n=await latency('https://www.google.com');$('latency').textContent=n==null?'—':fa(n);if(n!=null)gauge(n,'ms')}catch(e){}progress(30,'دانلود');try{$('download').textContent=(await download()).toFixed(1)}catch(e){$('download').textContent='—'}progress(52,'آپلود');try{$('upload').textContent=(await upload()).toFixed(1)}catch(e){$('upload').textContent='—'}progress(76,'بررسی سایت‌ها');await scan();progress(100,'تمام شد');notify('تست تمام شد')}catch(e){notify('تست ناموفق بود')}finally{testing=false;b.disabled=false;b.removeAttribute('aria-busy');$('startNum').textContent='↻';$('startLabel').textContent='تست دوباره';b.style.background='conic-gradient(var(--lime) 360deg,#202a23 360deg)'}});
$('refresh').addEventListener('click',async()=>{await load();if(statusData)notify('به‌روز شد');else notify('خطا')});load();
</script>
</body></html>
