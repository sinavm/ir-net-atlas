<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IR Net Atlas</title><style>:root{--bg:#070b16;--card:#121a2b;--line:#243049;--text:#e8eefc;--mute:#93a0bb;--up:#4ade80;--down:#f87171}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,sans-serif;background:radial-gradient(circle at top,#152038,var(--bg) 42%);color:var(--text)}main{max-width:980px;margin:0 auto;padding:28px 16px 60px}h1{margin:0 0 8px}.sub{color:var(--mute);line-height:1.8}.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;font-size:1.5rem;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.ok{color:var(--up)}.bad{color:var(--down)}.meta{color:var(--mute);font-size:.82rem;margin-top:6px}a{color:#93c5fd}footer{margin-top:28px;color:var(--mute);font-size:.85rem}</style></head><body><main><h1>IR Net Atlas</h1><p class="sub">رصدخانه دسترسی سرویس‌های عمومی. پروب از رانر گیتهاب است؛ گزارش داخل ایران جدا است.</p><div class="hero"><div class="stat">آنلاین<b id="up">—</b></div><div class="stat">آفلاین<b id="down">—</b></div><div class="stat">سلامت<b id="ratio">—</b></div><div class="stat">آخرین پروب<b id="when" style="font-size:1rem">—</b></div></div><div class="grid" id="grid"></div><footer>API: <a href="./status.json">status.json</a> · Badge: <a href="./badge.svg">badge.svg</a> · <a href="https://github.com/sinavm/ir-net-atlas">کد</a></footer></main><script>fetch('./status.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{document.getElementById('up').textContent=data.summary.up;document.getElementById('down').textContent=data.summary.down;document.getElementById('ratio').textContent=data.summary.ratio+'%';document.getElementById('when').textContent=(data.generated_at||'').replace('T',' ').replace('Z',' UTC');document.getElementById('grid').innerHTML=(data.targets||[]).map(t=>'<article class="card"><div>'+t.name+'</div><div class="'+(t.ok?'ok':'bad')+'">'+(t.ok?'UP':'DOWN')+' · '+t.ms+'ms</div><div class="meta">'+t.group+' · '+(t.error||t.status)+'</div></article>').join('');}).catch(()=>{document.getElementById('when').textContent='status pending';});</script></body></html>
