name: Probe atlas

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run probe
        run: python probe.py
      - name: Commit snapshots
        run: |
          git config user.name ir-net-atlas-bot
          git config user.email sina.bb2006@gmail.com
          git add docs/status.json docs/history.json docs/badge.svg
          git commit -m "chore: refresh atlas snapshot" || echo nochange
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  pages:
    needs: probe
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
