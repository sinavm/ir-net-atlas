name: Probe atlas

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
    - cron: '18 */3 * * *'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile probe.py fetch_inside.py
      - name: Outside probe
        run: python probe.py
      - name: Inside-Iran ingest
        run: python fetch_inside.py || true
      - name: Commit snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh atlas snapshot"
          file_pattern: docs/status.json docs/history.json docs/badge.svg docs/inside.json docs/targets.json
